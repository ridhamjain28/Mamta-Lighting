name: Supabase Keepalive

on:
  schedule:
    # Run every day at 12:00 UTC (noon)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Keepalive API
        run: |
          echo "Pinging Render backend to keep Supabase active..."
          curl -sS https://mamta-backend.onrender.com/api/keepalive
