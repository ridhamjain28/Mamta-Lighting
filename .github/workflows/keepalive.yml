name: Keep Backend Alive

on:
  schedule:
    # Run every 14 minutes during business hours (Mon-Sat, 9 AM to ~8:30 PM IST)
    # IST is UTC+5:30. So 9:00 AM IST = 3:30 AM UTC. 8:30 PM IST = 3:00 PM UTC.
    # We use hours 3 through 15 (UTC) which roughly covers IST business hours.
    # This runs 4 times an hour for 13 hours = 52 runs/day * 26 days = 1,352 minutes/month
    # This is well within the 2,000 free GitHub Actions minutes limit!
    - cron: '*/14 3-15 * * 1-6'
  
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Render backend to prevent cold starts..."
          curl -sS https://mamta-backend.onrender.com/api/keepalive || echo "Ping failed (server might be waking up)"
